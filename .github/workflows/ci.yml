name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: MX UI (typecheck, tests, build)
    runs-on: ubuntu-24.04
    steps:
      # Side by side, so "file:../paperboat-shared" resolves.
      - uses: actions/checkout@v4
        with:
          path: squero-studio-mx
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat-shared
          path: paperboat-shared
          token: ${{ secrets.DOWNSTREAM_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: paperboat-shared
      - run: npm install
        working-directory: squero-studio-mx
      - run: npm run typecheck
        working-directory: squero-studio-mx
      - run: npm test
        working-directory: squero-studio-mx
      - run: npm run build
        working-directory: squero-studio-mx

  # `paperboat start squero-studio-mx` as a user runs it, beside a paperboat checkout, with a native
  # Julia kernel: the page, the kernel's hello and one evaluation (test/launch/check.mjs).
  launch:
    name: Launch through paperboat on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: squero-studio-mx
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat-shared
          path: paperboat-shared
          token: ${{ secrets.DOWNSTREAM_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat
          path: paperboat
          token: ${{ secrets.DOWNSTREAM_TOKEN || github.token }}
      # private: the kernel and SqueroBase need DOWNSTREAM_TOKEN
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/squero-julia-kernel
          path: squero-julia-kernel
          token: ${{ secrets.DOWNSTREAM_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/squero-mx-base
          path: squero-mx-base
          token: ${{ secrets.DOWNSTREAM_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.6"  # the kernel image's
      - name: Julia packages of the kernel
        run: julia --startup-file=no --project=squero-julia-kernel -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: The app
        run: |
          (cd paperboat-shared && npm ci --no-audit --no-fund)
          cd squero-studio-mx && npm ci --no-audit --no-fund && npm run build
      - name: The paperboat CLI
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S paperboat/engine -B paperboat/engine/build -G "Visual Studio 17 2022" -A x64
            cmake --build paperboat/engine/build --config Release --target paperboat --parallel
            echo "PAPERBOAT=$GITHUB_WORKSPACE/paperboat/engine/build/tools/Release/paperboat.exe" >> "$GITHUB_ENV"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
            cmake -S paperboat/engine -B paperboat/engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build paperboat/engine/build --target paperboat
            echo "PAPERBOAT=$GITHUB_WORKSPACE/paperboat/engine/build/tools/paperboat" >> "$GITHUB_ENV"
          fi
      - name: paperboat start squero-studio-mx, check it, stop it
        env:
          SQUERO_JULIA: native
        run: |
          cd "$RUNNER_TEMP"   # not the checkout: the app must find its own files
          "$PAPERBOAT" start squero-studio-mx --daemon
          for i in $(seq 60); do curl -sf http://127.0.0.1:59301/ >/dev/null && break; sleep 1; done
          # paperboat logs to /tmp, or %TEMP% on Windows, which is Git Bash's /tmp
          node "$GITHUB_WORKSPACE/squero-studio-mx/test/launch/check.mjs" 59301 || { cat /tmp/paperboat-squero-studio-mx.log; exit 1; }
          "$PAPERBOAT" stop squero-studio-mx
